<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure CSS Logos | AgriLink & BarangayFix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1>Pure CSS Logo Design</h1>
    <p>Two logos built entirely with HTML &amp; CSS — no images used.</p>
  </header>

  <main class="logo-showcase">

    <section class="logo-card">
      <div class="logo agrilink-logo">
        <div class="agrilink-circle">
          <div class="agrilink-leaf agrilink-leaf-left"></div>
          <div class="agrilink-leaf agrilink-leaf-right"></div>
          <div class="agrilink-stem"></div>
        </div>
        <p class="logo-text agrilink-text">Agri<span>Link</span></p>
      </div>
      <p class="logo-caption">AgriLink — connecting farmers to markets and resources.</p>
    </section>


    <section class="logo-card">
      <div class="logo barangayfix-logo">
        <div class="barangayfix-icon">
          <div class="barangayfix-roof"></div>
          <div class="barangayfix-house">
            <div class="barangayfix-door"></div>
          </div>
          <div class="barangayfix-wrench">
            <div class="barangayfix-wrench-handle"></div>
            <div class="barangayfix-wrench-head"></div>
          </div>
        </div>
        <p class="logo-text barangayfix-text">Barangay<span>Fix</span></p>
      </div>
      <p class="logo-caption">BarangayFix — reporting and fixing community concerns.</p>
    </section>

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 AgriLink &amp; BarangayFix. Built with pure HTML/CSS.</p>
  </footer>

</body>
</html>
